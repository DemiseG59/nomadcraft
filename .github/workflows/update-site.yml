name: Update Nomadcraft site

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"   # pull fresh stats and map about every 30 minutes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      FTP_PORT: ${{ secrets.FTP_PORT }}
      FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install FTP client
        if: env.FTP_HOST != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Download player stats from the server
        if: env.FTP_HOST != ''
        continue-on-error: true
        run: |
          mkdir -p mc
          lftp -u "$FTP_USER","$FTP_PASS" -p "${FTP_PORT:-21}" "${FTP_PROTOCOL:-ftp}://$FTP_HOST" -e "
            set ssl:verify-certificate no;
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set ftp:passive-mode on;
            mirror --no-perms profile_yhsfd/World/players/stats mc/stats;
            mirror --no-perms profile_yhsfd/World/players/advancements mc/advancements;
            get profile_yhsfd/usercache.json -o mc/usercache.json;
            bye"

      - name: Build leaderboard
        run: |
          chmod -R u+rwX mc 2>/dev/null || true
          python3 scripts/build_leaderboard.py --mc mc --out site/data/leaderboard.json

      - name: Restore map cache
        uses: actions/cache/restore@v4
        with:
          path: bluemap-cache
          key: bluemap-${{ github.run_id }}
          restore-keys: bluemap-

      - name: Download BlueMap files (only changed tiles)
        if: env.FTP_HOST != ''
        continue-on-error: true
        timeout-minutes: 30
        run: |
          mkdir -p bluemap-cache/web
          lftp -u "$FTP_USER","$FTP_PASS" -p "${FTP_PORT:-21}" "${FTP_PROTOCOL:-ftp}://$FTP_HOST" -e "
            set ssl:verify-certificate no;
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set ftp:passive-mode on;
            mirror --no-perms --only-newer --parallel=8 --exclude sql.php --exclude live/ profile_yhsfd/bluemap/web bluemap-cache/web;
            bye"
          chmod -R u+rwX bluemap-cache 2>/dev/null || true
          du -sh bluemap-cache/web || true

      - name: Save map cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bluemap-cache
          key: bluemap-${{ github.run_id }}

      - name: Add map to the site
        run: |
          if [ -f bluemap-cache/web/index.html ]; then
            rm -rf site/map
            cp -r bluemap-cache/web site/map
            find site/map -name '*.gz' -exec gunzip -f {} + || true
            SIZE=$(du -sm site/map | cut -f1)
            echo "Map size: ${SIZE} MB"
            if [ "$SIZE" -gt 900 ]; then
              echo "Map is too big for GitHub Pages, leaving it out this time."
              rm -rf site/map
            fi
          else
            echo "No BlueMap files yet."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
